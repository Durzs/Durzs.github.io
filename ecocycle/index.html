/* ============ tokens ============ */
:root{
  --ground:#E9EDE6;
  --ink:#0F1F1D;
  --muted:#5C6E6A;
  --line:#C6D0C8;
  --paper:#F7F8F4;
  --oil:#DE9226;
  --oil-deep:#A9661A;
  --oil-glow:#F2B75B;
  --sys:#0E5A63;
  --sys2:#12808C;
  --money:#1F7A4D;
  --water:#3E6BB5;
  --risk:#C8452F;

  --shell:#0B1416;
  --shell-ink:#DCE7E3;
  --shell-muted:#7E9491;
  --shell-line:#1E3236;

  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Public Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--shell);
  color:var(--shell-ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ============ shell layout ============ */
.app{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:16px;
}
.frame{
  position:relative;
  width:1920px;height:1080px;
  transform-origin:top left;
  flex:0 0 auto;
}
.frame-wrap{position:relative;flex:0 1 auto}

/* ============ the stage (the "film") ============ */
.stage{
  position:absolute;inset:0;
  width:1920px;height:1080px;
  overflow:hidden;
  background:var(--ground);
  color:var(--ink);
  border-radius:6px;
}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}

/* header */
.hdr{position:absolute;left:96px;top:56px;right:96px;display:flex;align-items:flex-start;justify-content:space-between;gap:40px}
.hdr-l{max-width:1200px}
.eyebrow{
  font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.20em;
  text-transform:uppercase;color:var(--sys);
  display:flex;align-items:center;gap:14px;
}
.eyebrow .dot{width:10px;height:10px;border-radius:50%;background:var(--oil);flex:0 0 auto}
.title{
  font-family:var(--display);font-weight:800;font-size:58px;line-height:1.02;
  letter-spacing:-.022em;margin-top:12px;text-wrap:balance;color:var(--ink);
}
.steps{display:flex;gap:10px;align-items:center;padding-top:6px}
.step-chip{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--mono);font-size:19px;font-weight:500;
  border:2px solid var(--line);color:var(--muted);background:transparent;
}
.step-chip.done{border-color:var(--sys);color:var(--sys)}
.step-chip.on{border-color:var(--sys);background:var(--sys);color:#F2F7F5}

/* caption band */
.capband{
  position:absolute;left:0;right:0;bottom:0;height:236px;
  display:flex;align-items:center;justify-content:center;
  padding:0 150px 26px;
}
.cap{
  font-family:var(--body);font-weight:500;font-size:40px;line-height:1.32;
  letter-spacing:-.008em;text-align:center;max-width:1480px;color:var(--ink);
  text-wrap:balance;
}
.cap b{font-weight:700;color:var(--oil-deep)}
.cap i{font-style:normal;font-weight:700;color:var(--sys)}
.cap u{text-decoration:none;font-weight:700;color:var(--risk)}
.cap s{text-decoration:none;font-weight:700;color:var(--money)}

/* stage is dark during act 1 */
.stage.dark{background:#0D1719;color:#E8F0ED}
.stage.dark .title{color:#F1F6F3}
.stage.dark .eyebrow{color:#79B8AE}
.stage.dark .cap{color:#E4EDEA}
.stage.dark .cap b{color:var(--oil-glow)}
.stage.dark .cap i{color:#6FC3BC}
.stage.dark .cap u{color:#F0705E}

/* footer hairline + brand */
.progress{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(15,31,29,.10)}
.stage.dark .progress{background:rgba(232,240,237,.14)}
.progress i{display:block;height:100%;background:var(--oil);width:0}
.brand{
  position:absolute;right:96px;bottom:38px;
  font-family:var(--mono);font-size:17px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);opacity:.75;
}
.stage.dark .brand{color:#7E9491}

/* ============ controls ============ */
.controls{
  width:100%;max-width:1180px;flex:0 0 auto;
  display:flex;align-items:center;gap:16px;
  font-family:var(--mono);font-size:13px;color:var(--shell-muted);
}
.btn{
  appearance:none;border:1px solid var(--shell-line);background:#111E21;color:var(--shell-ink);
  border-radius:9px;padding:9px 14px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;
  cursor:pointer;text-transform:uppercase;
}
.btn:hover{border-color:#2E4B50;background:#16272B}
.btn:focus-visible{outline:2px solid var(--oil);outline-offset:2px}
.btn.play{min-width:96px}
.scrub{
  flex:1;position:relative;height:30px;display:flex;align-items:center;cursor:pointer;
}
.scrub-track{position:absolute;left:0;right:0;height:6px;border-radius:3px;background:#152528;overflow:hidden}
.scrub-fill{height:100%;background:var(--oil)}
.scrub-marks{position:absolute;left:0;right:0;height:14px;pointer-events:none}
.scrub-marks i{position:absolute;top:0;width:2px;height:14px;background:#2B4449}
.time{min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.chapters{
  width:100%;max-width:1180px;display:flex;flex-wrap:wrap;gap:7px;flex:0 0 auto;
}
.cutbar{
  width:100%;max-width:1180px;display:flex;gap:8px;flex:0 0 auto;align-items:center;
}
.chip.cut{
  border-color:#2E4B50;color:var(--shell-ink);padding:7px 15px;font-size:13px;letter-spacing:.05em;
}
.chip.cut[aria-current="true"]{background:var(--sys);border-color:var(--sys);color:#EAF5F2;font-weight:500}
.chip{
  appearance:none;border:1px solid var(--shell-line);background:transparent;color:var(--shell-muted);
  border-radius:999px;padding:6px 12px;font-family:var(--mono);font-size:12px;cursor:pointer;
  letter-spacing:.04em;
}
.chip:hover{color:var(--shell-ink);border-color:#2E4B50}
.chip[aria-current="true"]{background:var(--oil);border-color:var(--oil);color:#1B1204;font-weight:500}
.chip:focus-visible{outline:2px solid var(--oil);outline-offset:2px}

body.capture .controls,body.capture .chapters,body.capture .cutbar{display:none}
body.capture .app{padding:0;gap:0}
body.capture .stage{border-radius:0}

@media (prefers-reduced-motion:reduce){.frame{transition:none}}

<script>
/* ============================================================
   EcoCycle — collector system explainer
   Deterministic timeline: every frame is a pure function of t.
   ============================================================ */
(function(){
'use strict';

/* ---------- palette ---------- */
var P = {
  oil:'#DE9226', oilDeep:'#A9661A', oilGlow:'#F2B75B', oilPale:'#F6DEB4',
  sys:'#0E5A63', sys2:'#12808C', sysPale:'#CFE2E1',
  money:'#1F7A4D', moneyPale:'#CDE4D6',
  water:'#3E6BB5', waterPale:'#D3DEEE',
  risk:'#C8452F', riskPale:'#F2D6CE',
  ink:'#0F1F1D', muted:'#5C6E6A', line:'#C6D0C8', paper:'#F7F8F4', ground:'#E9EDE6'
};
var D = { ink:'#E8F0ED', muted:'#8CA3A0', line:'#2A4245', surf:'#152528', surf2:'#1D3236', ground:'#0D1719' };

/* ---------- tiny dom helpers ---------- */
var NS='http://www.w3.org/2000/svg';
function e(tag,a,kids){
  var n=document.createElementNS(NS,tag),k;
  if(a) for(k in a){ if(a[k]!==null&&a[k]!==undefined) n.setAttribute(k,a[k]); }
  if(kids) for(var i=0;i<kids.length;i++){ if(kids[i]) n.appendChild(kids[i]); }
  return n;
}
function g(a,kids){ return e('g',a,kids); }
function set(n,a){ for(var k in a){ if(a[k]!==null&&a[k]!==undefined) n.setAttribute(k,a[k]); } return n; }
function op(n,v){ n.setAttribute('opacity',v); return n; }
function xf(n,v){ n.setAttribute('transform',v); return n; }

/* text: family f = 'd' display, 'b' body, 'm' mono */
var FAM={d:"'Bricolage Grotesque',sans-serif",b:"'Public Sans',sans-serif",m:"'IBM Plex Mono',monospace"};
function tx(str,o){
  o=o||{};
  var n=e('text',{
    x:o.x||0,y:o.y||0,
    'font-family':FAM[o.f||'b'],
    'font-size':o.size||24,
    'font-weight':o.w||500,
    fill:o.fill||P.ink,
    'text-anchor':o.anchor||'start',
    'letter-spacing':o.ls||0,
    opacity:o.opacity===undefined?1:o.opacity

  n.textContent=str;
  return n;
}
function txl(lines,o){
  o=o||{};var lh=o.lh||(o.size||24)*1.28;
  var n=tx('',o);
  for(var i=0;i<lines.length;i++){
    var s=document.createElementNS(NS,'tspan');
    s.setAttribute('x',o.x||0); s.setAttribute('y',(o.y||0)+i*lh);
    s.textContent=lines[i]; n.appendChild(s);
  }
  return n;
}

/* ---------- math ---------- */
function cl(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return v<a?a:(v>b?b:v);}
function pr(t,a,b){ return b<=a ? (t>=b?1:0) : cl((t-a)/(b-a)); }
function eo(t){ return 1-Math.pow(1-t,3); }
function eo2(t){ return 1-Math.pow(1-t,2); }
function ei(t){ return t*t*t; }
function eio(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function eb(t){ var c=1.9; return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2); }
function mix(a,b,t){ return a+(b-a)*t; }
/* eased progress in [a,b] */
function ep(t,a,b,f){ return (f||eo)(pr(t,a,b)); }
/* appear then hold; returns 0..1 */
function fade(t,inA,inB,outA,outB){
  var v=pr(t,inA,inB);
  if(outA!==undefined) v=Math.min(v,1-pr(t,outA,outB));
  return v;
}
function hexmix(h1,h2,t){
  function p(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
  var a=p(h1),b=p(h2),o='#';
  for(var i=0;i<3;i++){ var v=Math.round(mix(a[i],b[i],cl(t))).toString(16); o+=v.length<2?'0'+v:v; }
  return o;
}
/* deterministic pseudo-random */
function rnd(seed){ var x=Math.sin(seed*127.1+311.7)*43758.5453; return x-Math.floor(x); }

/* ============================================================
   icon library — every builder returns a <g>, refs on g.r
   ============================================================ */

/* pseudo-QR glyph, deterministic from seed */
function gQR(size,seed,fill,bg){
  var N=13, cell=size/N, kids=[], i,j;
  if(bg) kids.push(e('rect',{x:0,y:0,width:size,height:size,rx:2,fill:bg}));
  function finder(cx,cy){
    kids.push(e('rect',{x:cx*cell,y:cy*cell,width:cell*4,height:cell*4,fill:fill}));
    kids.push(e('rect',{x:(cx+1)*cell,y:(cy+1)*cell,width:cell*2,height:cell*2,fill:bg||'#fff'}));
    kids.push(e('rect',{x:(cx+1.4)*cell,y:(cy+1.4)*cell,width:cell*1.2,height:cell*1.2,fill:fill}));
  }
  for(i=0;i<N;i++)for(j=0;j<N;j++){
    var inF=(i<5&&j<5)||(i>N-6&&j<5)||(i<5&&j>N-6);
    if(inF) continue;
    if(rnd(seed+i*31.7+j*7.3)>0.5)
      kids.push(e('rect',{x:i*cell,y:j*cell,width:cell,height:cell,fill:fill}));
  }
  finder(0,0); finder(N-4,0); finder(0,N-4);
  return g(null,kids);
}

/* small shop / food establishment */
function gShop(o){
  o=o||{}; var w=o.w||210,h=o.h||150,c=o.c||'#D9DFD6',awn=o.awn||P.oil,ink=o.ink||P.ink,ln=o.ln||P.line;
  var k=[];

  /* signboard */
  k.push(e('rect',{x:12,y:10,width:w-24,height:26,rx:3,fill:ink,opacity:.86}));
  /* awning */
  var aw=[];
  for(var i=0;i<5;i++){
    aw.push(e('path',{d:'M'+(12+i*((w-24)/5))+',46 h'+((w-24)/5)+' l-6,26 h-'+((w-24)/5)+' z',
      fill:i%2?awn:hexmix(awn,'#ffffff',.45)}));
  }
  k.push(g(null,aw));
  /* window + door */
  k.push(e('rect',{x:20,y:88,width:w*0.42,height:h-102,rx:3,fill:'#FFFFFF',opacity:.55,stroke:ln,'stroke-width':2}));
  k.push(e('rect',{x:w-20-w*0.28,y:84,width:w*0.28,height:h-84,rx:3,fill:ink,opacity:.14,stroke:ln,'stroke-width':2}));

  var n=g({transform:'translate('+(o.x||0)+','+(o.y||0)+')'+(o.s?' scale('+o.s+')':'')},k);
  return n;
}

  k.push(e('rect',{x:0,y:h-30,width:w,height:30,rx:3,fill:ln,opacity:.9}));
  if(o.label) k.push(tx(o.label,{x:w/2,y:h-10,size:o.ls||15,f:'m',fill:'#EFF6F4',anchor:'middle',ls:'.08em'}));
  return g({transform:'translate('+(o.x||0)+','+(o.y||0)+')'+(o.s?' scale('+o.s+')':'')},k);
}

/* processing plant */
function gPlant(o){
  o=o||{}; var c=o.c||'#DFE4DC',ln=o.ln||P.sys,k=[];
  k.push(e('rect',{x:0,y:60,width:190,height:110,rx:4,fill:c,stroke:ln,'stroke-width':3}));

/* simple house (riverside community) */
function gHouse(o){
  o=o||{}; var w=o.w||150,h=o.h||110,c=o.c||'#D7DDD4',ln=o.ln||P.line,k=[];
  k.push(e('path',{d:'M-10,26 L'+(w/2)+',-14 L'+(w+10)+',26 Z',fill:o.roof||'#B9C2B8'}));

function gBottle(o){
  o=o||{}; var s=o.s||1, ln=o.ln||P.ink, k=[], r={};
  var body='M14,26 h32 v10 c0,6 6,6 6,14 v56 c0,7-5,12-12,12 h-20 c-7,0-12-5-12-12 v-56 c0,-8 6,-8 6,-14 z';

  if(o.qr!==false){

      e('rect',{x:-4,y:-4,width:36,height:36,rx:3,fill:'#FBFBF7',stroke:ln,'stroke-width':2}),

/* phone with screen slot. refs: screen (g) */
function gPhone(o){

/* data card (paper) — rows of mono key/value */
function gCard(o){
  o=o||{}; var w=o.w||360,h=o.h||0,rows=o.rows||[],ln=o.ln||P.line,k=[],r={};
  var pad=o.pad||22, rh=o.rh||34, headH=o.title?46:10;

/* ===================== PLAYER ===================== */
(function(){
var E=window.__EC, S=E.SCENES, CUTS=E.CUTS;
var film=document.getElementById('film'),
    stage=document.getElementById('stage'),
    capEl=document.getElementById('cap'),
    eyeEl=document.getElementById('eyebrow'),
    eyeT=document.getElementById('eyebrow-t'),
    titleEl=document.getElementById('title'),
    stepsEl=document.getElementById('steps'),
    progEl=document.getElementById('prog'),
    frame=document.getElementById('frame'),
    wrap=frame.parentNode;

var XF=0.34;               /* cross-fade between entries, seconds */
var i, byId={};

/* ---- mount every scene once; cuts reuse them ---- */
for(i=0;i<S.length;i++){
  var sc=S[i];
  var d=document.createElement('div');
  d.className='scene'; d.style.visibility='hidden';
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 1920 1080');
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  d.appendChild(svg); film.appendChild(d);
  sc.el=d; sc.svg=svg; byId[sc.id]=sc;
  sc.build(svg);
}

/* the full cut is every scene, at its own pace */
for(i=0;i<CUTS.length;i++) if(CUTS[i].id==='full'){
  CUTS[i].entries=S.map(function(sc){
    return {id:sc.id,from:0,to:sc.dur,dur:sc.dur,cues:sc.cues||[]};
  });
}

/* ---- program: the active cut, laid out on one timeline ---- */
var PROG=[], T=0, CUT=null;
function loadCut(id){
  var cut=null;
  for(var k=0;k<CUTS.length;k++) if(CUTS[k].id===id) cut=CUTS[k];
  if(!cut) cut=CUTS[0];
  CUT=cut; PROG=[]; T=0;
  for(var j=0;j<cut.entries.length;j++){
    var en=cut.entries[j], sc=byId[en.id];
    if(!sc) continue;
    PROG.push({
      sc:sc, t0:T, dur:en.dur, from:en.from, to:en.to,
      cues:en.cues||sc.cues||[],
      chapter:en.chapter||sc.chapter,
      eyebrow:en.eyebrow||sc.eyebrow,
      title:en.title||sc.title
    });
    T+=en.dur;
  }
  buildChapters(); buildMarks(); lastTitle=null; lastCap=null;
  if(cutBtns.length) for(var q=0;q<cutBtns.length;q++)
    cutBtns[q].b.setAttribute('aria-current', cutBtns[q].id===cut.id ? 'true':'false');
  return T;
}
/* native time inside a scene for a given entry-local time */
function nat(en,lt){ return en.from + (en.to-en.from)*(en.dur?cl01(lt/en.dur):0); }
function cl01(v){ return v<0?0:(v>1?1:v); }

/* ---- step chips ---- */
var chips=[];
for(i=0;i<6;i++){
  var c=document.createElement('div');
  c.className='step-chip'; c.textContent=String(i+1);
  stepsEl.appendChild(c); chips.push(c);
}

/* ---- chapters + timeline marks ---- */
var chapEl=document.getElementById('chapters'), chapBtns=[];
var marks=document.getElementById('scrubMarks');
function buildChapters(){
  chapEl.innerHTML=''; chapBtns=[];
  for(var k=0;k<PROG.length;k++) (function(en){
    if(!en.chapter) return;
    var b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=en.chapter;
    b.addEventListener('click',function(){ seek(en.t0+0.01); });
    chapEl.appendChild(b); chapBtns.push({b:b,en:en});
  })(PROG[k]);
}
function buildMarks(){
  marks.innerHTML='';
  for(var k=1;k<PROG.length;k++){
    var m=document.createElement('i'); m.style.left=(PROG[k].t0/T*100)+'%'; marks.appendChild(m);
  }
}

/* ---- cut selector ---- */
var cutEl=document.getElementById('cutbar'), cutBtns=[];
function buildCutBar(){
  if(!cutEl) return;
  cutEl.innerHTML='';
  for(var k=0;k<CUTS.length;k++) (function(cut){
    var total=0;
    for(var j=0;j<cut.entries.length;j++) total+=cut.entries[j].dur;
    var b=document.createElement('button');
    b.className='chip cut'; b.type='button';
    b.textContent=cut.label+' · '+fmt(total);
    b.title=cut.note||'';
    b.addEventListener('click',function(){
      var wasPlaying=playing; pause();
      loadCut(cut.id); now=0; render(0);
      if(wasPlaying) play();
    });
    cutEl.appendChild(b); cutBtns.push({b:b,id:cut.id});
  })(CUTS[k]);
}

/* ---- render ---- */
var lastCap=null, lastTitle=null;

function findEntry(t){
  for(var k=PROG.length-1;k>=0;k--) if(t>=PROG[k].t0) return k;
  return 0;
}
function fadeAmt(x,a,b){ return x<a?0:(x>b?1:(x-a)/(b-a)); }

function render(t){
  t=Math.max(0,Math.min(T-0.001,t));
  var k=findEntry(t), en=PROG[k], lt=t-en.t0, prev=k>0?PROG[k-1]:null;
  var sc=en.sc, ntime=nat(en,lt);

  /* visibility + crossfade (a scene can appear in several entries, never adjacent) */
  for(var j=0;j<S.length;j++){
    var vis=(S[j]===sc)||(prev&&S[j]===prev.sc&&lt<XF);
    if(S[j].el.style.visibility!==(vis?'visible':'hidden'))
      S[j].el.style.visibility=vis?'visible':'hidden';
    if(!vis) S[j].el.style.opacity=0;
  }
  if(prev&&lt<XF&&prev.sc!==sc){
    prev.sc.el.style.opacity=String(1-lt/XF);
    prev.sc.update(Math.min(prev.sc.dur-0.001,prev.to));
    sc.el.style.opacity=String(lt/XF);
  } else {
    sc.el.style.opacity='1';
  }
  sc.update(ntime);

  /* theme */
  var dark = sc.darkAt ? sc.darkAt(ntime) : !!sc.dark;
  stage.classList.toggle('dark',dark);
  stage.style.background = sc.bg ? sc.bg(ntime) : (dark?'#0D1719':'#E9EDE6');

  /* header */
  var showH = !sc.hideHeader;
  var hA = showH ? fadeAmt(lt,0.15,0.9)*(1-fadeAmt(lt,en.dur-0.5,en.dur-0.05)) : 0;
  eyeEl.style.opacity=hA; titleEl.style.opacity=hA;
  eyeEl.style.transform='translateY('+((1-hA)*10)+'px)';
  titleEl.style.transform='translateY('+((1-hA)*14)+'px)';
  if(lastTitle!==en.t0+'|'+sc.id){
    eyeT.textContent=en.eyebrow||''; titleEl.textContent=en.title||'';
    lastTitle=en.t0+'|'+sc.id;
  }

  /* step chips */
  var showSteps = !!sc.step;
  stepsEl.style.opacity = showSteps ? hA : 0;
  if(showSteps) for(var q=0;q<6;q++)
    chips[q].className='step-chip'+(q+1===sc.step?' on':(q+1<sc.step?' done':''));

  /* caption */
  var html='', a=0;
  for(var c=0;c<en.cues.length;c++){
    var cu=en.cues[c], s0=cu[0], s1=cu[0]+cu[1];
    if(lt>=s0-0.25&&lt<=s1+0.3){
      html=cu[2];
      a=fadeAmt(lt,s0,s0+0.2)*(1-fadeAmt(lt,s1-0.02,s1+0.24));
      break;
    }
  }
  if(html!==lastCap){ capEl.innerHTML=html; lastCap=html; }
  capEl.style.opacity=a;
  capEl.style.transform='translateY('+((1-a)*7)+'px)';

  progEl.style.width=(t/T*100)+'%';

  if(!CAPTURE){
    fill.style.width=(t/T*100)+'%';
    timeEl.textContent=fmt(t)+' / '+fmt(T);
    for(var z=0;z<chapBtns.length;z++)
      chapBtns[z].b.setAttribute('aria-current', chapBtns[z].en===en ? 'true':'false');
  }
  now=t;
}

/* ---- transport ---- */
var now=0, playing=false, raf=null, anchor=0, anchorT=0;
var playBtn=document.getElementById('playBtn'),
    fill=document.getElementById('scrubFill'),
    timeEl=document.getElementById('time'),
    scrub=document.getElementById('scrub');
var CAPTURE=/[?&]capture=1/.test(location.search);

function fmt(s){ var m=Math.floor(s/60), x=Math.round(s%60); if(x===60){m++;x=0;} return m+':'+(x<10?'0':'')+x; }
function tick(){
  if(!playing) return;
  var t=anchorT+(performance.now()-anchor)/1000;
  if(t>=T){ render(T-0.001); pause(); return; }
  render(t); raf=requestAnimationFrame(tick);
}
function play(){
  if(now>=T-0.02) now=0;
  playing=true; anchor=performance.now(); anchorT=now;
  playBtn.textContent='❚❚ Pause'; playBtn.setAttribute('aria-label','Pause');
  raf=requestAnimationFrame(tick);
}
function pause(){
  playing=false; if(raf) cancelAnimationFrame(raf);
  playBtn.textContent='▶ Play'; playBtn.setAttribute('aria-label','Play');
}
function seek(t){ now=Math.max(0,Math.min(T-0.01,t)); anchorT=now; anchor=performance.now(); render(now); }

playBtn.addEventListener('click',function(){ playing?pause():play(); });
document.getElementById('backBtn').addEventListener('click',function(){ seek(now-10); });
document.getElementById('fwdBtn').addEventListener('click',function(){ seek(now+10); });

function scrubTo(ev){
  var r=scrub.getBoundingClientRect();
  seek(((ev.clientX-r.left)/r.width)*T);
}
var dragging=false;
scrub.addEventListener('pointerdown',function(ev){ dragging=true; scrub.setPointerCapture(ev.pointerId); scrubTo(ev); });
scrub.addEventListener('pointermove',function(ev){ if(dragging) scrubTo(ev); });
scrub.addEventListener('pointerup',function(){ dragging=false; });
scrub.addEventListener('keydown',function(ev){
  if(ev.key==='ArrowRight'){ seek(now+5); ev.preventDefault(); }
  if(ev.key==='ArrowLeft'){ seek(now-5); ev.preventDefault(); }
});
document.addEventListener('keydown',function(ev){
  if(ev.target.tagName==='BUTTON'&&ev.key===' ') return;
  if(ev.key===' '){ playing?pause():play(); ev.preventDefault(); }
  else if(ev.key==='ArrowRight'){ seek(now+5); }
  else if(ev.key==='ArrowLeft'){ seek(now-5); }
});

/* ---- responsive scaling ---- */
function resize(){
  var pad=CAPTURE?0:32;
  var availW=window.innerWidth-pad;
  var availH=window.innerHeight-(CAPTURE?0:186);
  var s=Math.min(availW/1920,availH/1080);
  if(CAPTURE) s=1;
  frame.style.transform='scale('+s+')';
  wrap.style.width=(1920*s)+'px';
  wrap.style.height=(1080*s)+'px';
}
window.addEventListener('resize',resize);

/* ---- boot ---- */
if(CAPTURE) document.body.classList.add('capture');
buildCutBar();
var m=/[?&]cut=([a-z0-9]+)/i.exec(location.search);
loadCut(m?m[1]:'full');
resize();

window.__ec={
  seek:function(t){ render(t); },
  get duration(){ return T; },
  setCut:function(id){ loadCut(id); render(0); return T; },
  cuts:CUTS.map(function(c){ return c.id; }),
  scenes:function(){ return PROG.map(function(en){ return {id:en.sc.id,t0:en.t0,dur:en.dur,cues:en.cues}; }); }
};

function boot(){
  resize(); render(0);
  window.__ecReady=true;
  var st=/[?&]t=([0-9.]+)/.exec(location.search);
  if(st){ seek(parseFloat(st[1])); }
  else if(!CAPTURE && !/[?&]paused=1/.test(location.search)) play();
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(boot); else setTimeout(boot,300);
})();

</script>
