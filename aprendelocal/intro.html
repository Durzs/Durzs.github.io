<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AprendeLocal · Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&display=block" rel="stylesheet">
<style>
  :root {
    --azul: #172B87;
    --azul-medio: #2A3CA8;
    --naranjo: #C9612A;
    --papel: #E4DED2;
    --noche: #070D29; /* #172B87 al 30 %: el «negro azulado» del plano 1, no es un color nuevo */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--noche); color: var(--papel); font: 500 15px/1.45 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #escena { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #stage { display: block; outline: 1px solid rgba(228, 222, 210, .12); }
  #controles { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 16px 16px; border-top: 1px solid rgba(228, 222, 210, .12); }
  button { font: inherit; color: var(--papel); background: transparent; border: 1px solid rgba(228, 222, 210, .35); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--papel); }
  button[aria-pressed="true"] { background: var(--papel); color: var(--azul); border-color: var(--papel); }
  #barra { flex: 1 1 220px; accent-color: var(--naranjo); }
  #tiempo { font-variant-numeric: tabular-nums; min-width: 8ch; }
  #plano { opacity: .8; }
  .formato { display: inline-flex; gap: 6px; }
  details { flex-basis: 100%; }
  summary { cursor: pointer; opacity: .85; }
  details label { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; max-width: 78ch; }
  details small { display: block; opacity: .7; }
  .limpio #controles { display: none; }
  .limpio #escena { padding: 0; }
  .limpio #stage { outline: none; }
</style>
</head>
<body>
<div id="app">
  <div id="escena">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Intro de marca de AprendeLocal"></svg>
  </div>
  <div id="controles">
    <button id="bPlay" type="button">Pausa</button>
    <button id="bReiniciar" type="button">Reiniciar</button>
    <input id="barra" type="range" min="0" max="25" step="0.01" value="0" aria-label="Línea de tiempo">
    <span id="tiempo">0,00 s</span>
    <span id="plano"></span>
    <span class="formato" role="group" aria-label="Formato">
      <button type="button" data-formato="16x9">16:9 · 1920×1080</button>
      <button type="button" data-formato="9x16">9:16 · 1080×1920</button>
    </span>
    <details>
      <summary>Elementos que requieren consulta previa a la comunidad (desactivados por defecto)</summary>
      <label><input type="checkbox" data-consulta="nombresMapuzugun">
        <span>Nombres en mapuzugun que ya usa la plataforma: pewen, pigda y chumaihuén junto al nombre científico, y Rukapillán junto a Villarrica.
        <small>Salen del catálogo de la plataforma (nativas.ts). Grafemario, escritura y pertinencia de mostrarlos se definen con la comunidad.</small></span></label>
      <label><input type="checkbox" data-consulta="fotoEstudiantes">
        <span>Recuadro para fotografía de estudiantes y docentes midiendo el estero.
        <small>Requiere además consentimiento informado de familias y docentes. Es un marcador de producción, no una imagen final.</small></span></label>
    </details>
  </div>
</div>

const NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
function mk(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);

}
function set(e, attrs) { for (const k in attrs) e.setAttribute(k, attrs[k]); }
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const lin = (t, a, b) => clamp((t - a) / (b - a));
const f1 = (v) => Math.round(v * 10) / 10;

/* Easing de marca: cubic-bezier(0.22, 1, 0.36, 1), salida suave, sin rebote. */
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { const v = sx(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return sy(t);
  };
}
const EASE = cubicBezier(0.22, 1, 0.36, 1);
const ez = (t, a, b) => EASE(lin(t, a, b));
/* Entra en [a,b] y sale en [c,d]. */
const ventana = (t, a, b, c, d) => Math.min(ez(t, a, b), 1 - ez(t, c, d));

function mulberry32(a) {

/* Catmull-Rom a Bézier: curvas suaves que pasan por los puntos. */
function curva(p, cerrada) {
  const n = p.length;
  const g = (i) => (cerrada ? p[(i + n) % n] : p[Math.max(0, Math.min(n - 1, i))]);
  let d = 'M' + f1(p[0][0]) + ',' + f1(p[0][1]);
  const fin = cerrada ? n : n - 1;
  for (let i = 0; i < fin; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    d += 'C' + f1(p1[0] + (p2[0] - p0[0]) / 6) + ',' + f1(p1[1] + (p2[1] - p0[1]) / 6) + ' ' +
      f1(p2[0] - (p3[0] - p1[0]) / 6) + ',' + f1(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + f1(p2[0]) + ',' + f1(p2[1]);

  const out = [];
  const n = p.length, g = (i) => p[Math.max(0, Math.min(n - 1, i))];
  for (let i = 0; i < n - 1; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    for (let k = 0; k < porTramo; k++) {
      const t = k / porTramo, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map((j) => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));

  }

/* Texto con marcado mínimo: *así* va en itálica (nombres científicos y
   magnitudes físicas); lo demás en redonda. */
const FAM = {
  archivo: { 'font-family': "'Archivo', sans-serif", 'font-weight': 800, 'letter-spacing': '-0.045em' },
  news: { 'font-family': "'Newsreader', serif", 'font-weight': 500 },
};
function texto(parent, str, o) {
  const t = mk('text', { x: o.x, y: o.y, 'font-size': o.size, fill: o.fill, 'text-anchor': o.anchor || 'start' }, parent);
  set(t, FAM[o.fam || 'news']);
  if (o.ls) t.setAttribute('letter-spacing', o.ls);
  for (const parte of str.split(/(\*[^*]+\*)/).filter(Boolean)) {
    const ts = mk('tspan', null, t);
    if (parte[0] === '*') { ts.setAttribute('font-style', 'italic'); ts.textContent = parte.slice(1, -1); } else ts.textContent = parte;
  }
  return t;
}
function ancho(t) { try { return t.getComputedTextLength(); } catch (e) { return 0; } }
function largo(p) { try { return p.getTotalLength(); } catch (e) { return 1000; } }
function dibujaTrazo(p, L, prog) {
  if (prog >= 1) { p.setAttribute('stroke-dasharray', 'none'); p.setAttribute('stroke-dashoffset', 0); }
  else { p.setAttribute('stroke-dasharray', L + ' ' + L); p.setAttribute('stroke-dashoffset', L * (1 - prog)); }
}

/* ==========================================================================
   Estado
   ========================================================================== */
const Q = new URLSearchParams(location.search);
let FORMATO = Q.get('formato') === '9x16' ? '9x16' : '16x9';
const LIMPIO = Q.has('limpio');
let L;          // layout activo
let S = {};     // referencias a nodos de la escena
let tActual = 0, reproduciendo = true, listo = false;

/* ==========================================================================
   Curvas de nivel: el material que atraviesa toda la pieza
   ========================================================================== */
const N = 16;   // curvas
const M = 180;  // puntos por curva
const TH = Array.from({ length: M }, (_, j) => Math.PI - (2 * Math.PI * j) / M);
const RC = 0.075; // radio del cráter respecto de la base
let RHO; // radios con ruido, fijos

function preparaRelieve() {
  const rnd = mulberry32(7);
  const armonicos = [1, 2, 3, 5, 8].map((f, i) => ({ f, a: [0.045, 0.04, 0.028, 0.016, 0.008][i], p: rnd() * 6.283, b: rnd() * 2 }));
  // Quebradas: muescas en V que apuntan a la cumbre, como el drenaje radial de un estratovolcán.
  const quebradas = Array.from({ length: 9 }, () => ({ th: rnd() * 6.283, w: 0.07 + rnd() * 0.07, d: 0.05 + rnd() * 0.06 }));
  RHO = [];
  for (let k = 0; k < N; k++) {
    const z = k / (N - 1);
    const r = RC + (1 - RC) * Math.pow(1 - z, 1.5);
    const fila = [];
    for (let j = 0; j < M; j++) {
      const th = TH[j];
      let n = 0;
      for (const h of armonicos) n += h.a * Math.sin(h.f * th + h.p + h.b * z);
      let g = 0;
      for (const q of quebradas) {
        let d = Math.abs(((th - q.th + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (d < q.w) g -= q.d * Math.pow(1 - d / q.w, 1.6) * Math.pow(1 - z, 0.6);
      }
      fila.push(r * (1 + n * (0.55 + 0.45 * (1 - z)) + g));
    }
    RHO.push(fila);
  }
}
function ptsPlano(k) { const P = L.plano; return RHO[k].map((r, j) => [P.cx + r * Math.cos(TH[j]) * P.s, P.cy + r * Math.sin(TH[j]) * P.s]); }
function ptsVolcan(k, V) {
  const z = k / (N - 1);
  return RHO[k].map((r, j) => [V.cx + r * Math.cos(TH[j]) * V.sx, V.by - z * V.h + r * Math.sin(TH[j]) * V.sx * V.q]);
}
function ptsMorro(k) {
  const G = L.morro;
  if (k < 3) {
    // Tres líneas de agua: la bahía. Anillos muy aplastados que se leen como una sola línea.
    return TH.map((th) => {
      const x = G.marCx + Math.cos(th) * G.marHw;
      return [x, G.marY + k * G.marGap + Math.sin(th) * 1.2 + Math.sin(x / 58 + k * 1.7) * 4];
    });
  }
  const zz = ((k - 3) / (N - 4)) * 0.97;
  // Domo de granito: laderas casi verticales, cima redonda, falda más ancha.
  const r = Math.sqrt(Math.max(0, 1 - Math.pow(zz, 2.6))) * (1 + 0.32 * Math.pow(1 - zz, 4));
  const cx = G.cx + G.lean * Math.pow(zz, 1.3) * G.rw;
  return TH.map((th) => {
    const rho = r * (1 + 0.045 * Math.sin(2 * th + k * 0.35) + 0.02 * Math.sin(5 * th + 1.3 + k * 0.2) + 0.1 * Math.max(0, Math.cos(th - 0.2)) * (1 - zz));
    return [cx + rho * Math.cos(th) * G.rw, G.by - zz * G.h + rho * Math.sin(th) * G.rw * G.q];
  });
}

/* Contornos del logo como destino de las curvas: se muestrean de las curvas
   oficiales y se orientan igual que los anillos (desde la izquierda, por abajo). */
function contornoLogo(d, matriz) {
  const p = mk('path', { d, fill: 'none' }, S.medidor);
  const Lt = p.getTotalLength();
  let pts = [];
  for (let i = 0; i < M; i++) { const q = p.getPointAtLength((Lt * i) / M); pts.push([matriz[1] + q.x * matriz[0], matriz[2] + q.y * matriz[0]]); }
  p.remove();
  let area = 0;
  for (let i = 0; i < M; i++) { const a = pts[i], b = pts[(i + 1) % M]; area += a[0] * b[1] - b[0] * a[1]; }
  if (area > 0) pts.reverse();
  let iMin = 0;
  for (let i = 1; i < M; i++) if (pts[i][0] < pts[iMin][0] - 0.01 || (Math.abs(pts[i][0] - pts[iMin][0]) <= 0.01 && pts[i][1] > pts[iMin][1])) iMin = i;
  pts = pts.slice(iMin).concat(pts.slice(0, iMin));
  const c = pts.reduce((s, q) => [s[0] + q[0] / M, s[1] + q[1] / M], [0, 0]);
  return { pts, c };
}

/* ==========================================================================
   Construcción
   ========================================================================== */
function construir() {
  L = LAYOUTS[FORMATO];
  const svg = $('#stage');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${L.W} ${L.H}`);
  S = {};
  S.defs = mk('defs', null, svg);
  S.medidor = mk('g', { opacity: 0 }, svg);

  // Fondo
  S.fondo = mk('rect', { x: 0, y: 0, width: L.W, height: L.H, fill: C.azul }, svg);

  // Cielo del plano 3: luz baja y húmeda cerca del horizonte
  S.cielo = mk('g', { opacity: 0 }, svg);
  mk('rect', { x: 0, y: 0, width: L.W, height: L.H, fill: C.azulMedio }, S.cielo);
  const rg = mk('radialGradient', { id: 'resplandor', cx: 0.5, cy: 0.5, r: 0.5 }, S.defs);
  mk('stop', { offset: 0, 'stop-color': C.papel, 'stop-opacity': 0.30 }, rg);
  mk('stop', { offset: 0.5, 'stop-color': C.papel, 'stop-opacity': 0.12 }, rg);
  mk('stop', { offset: 1, 'stop-color': C.papel, 'stop-opacity': 0 }, rg);
  const a3 = L.s3.arbol;
  mk('ellipse', { cx: a3.x - L.W * 0.1, cy: L.s3.bosque + 40, rx: L.W * 0.62, ry: L.H * (FORMATO === '16x9' ? 0.46 : 0.26), fill: 'url(#resplandor)' }, S.cielo);

  // Retícula del cuaderno de campo (planos 4 y 5)
  S.reticula = mk('path', { d: reticula(60), stroke: C.azulMedio, 'stroke-width': 1.5, fill: 'none', opacity: 0 }, svg);

  // Silueta lejana del volcán (plano 3)
  S.lejos = mk('g', { opacity: 0 }, svg);
  preparaRelieve();
  construirSilueta();

  // Curvas de nivel
  S.curvasG = mk('g', { 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
  S.curvas = [];
  const planos = [], volcanes = [], volcanes6 = [], morros = [];
  for (let k = 0; k < N; k++) {
    planos.push(ptsPlano(k)); volcanes.push(ptsVolcan(k, L.volcan)); volcanes6.push(ptsVolcan(k, L.volcan6)); morros.push(ptsMorro(k));
    const p = mk('path', { d: curva(planos[k], true), fill: C.azul, stroke: C.papel, 'stroke-width': L.trazo }, S.curvasG);
    S.curvas.push({ p, L: largo(p) });
  }
  S.geo = { planos, volcanes, volcanes6, morros };

  // Niebla en capas de azul
  S.nieblas = L.niebla.map((n, i) => {
    const id = 'niebla' + i;
    const lg = mk('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1 }, S.defs);
    mk('stop', { offset: 0, 'stop-color': n.c, 'stop-opacity': 0 }, lg);
    mk('stop', { offset: 0.32, 'stop-color': n.c, 'stop-opacity': n.a }, lg);
    mk('stop', { offset: 1, 'stop-color': n.c, 'stop-opacity': n.a * 0.8 }, lg);
    const y0 = L.volcan.by + n.dy;
    const pts = [];
    for (let x = -L.W * 0.9; x <= L.W * 1.9; x += 24) pts.push([x, y0 + 16 * Math.sin(x / 170 + i * 2) + 9 * Math.sin(x / 61 + i)]);
    const d = curva(pts, false) + `L${L.W * 1.9},${L.H + 60}L${-L.W * 0.9},${L.H + 60}Z`;
    return { p: mk('path', { d, fill: `url(#${id})`, opacity: 0 }, svg), n };
  });

  // Paisaje cercano del plano 3: bosque, suelo, araucaria, medición
  S.paisaje = mk('g', { opacity: 0 }, svg);
  construirBosque();
  S.suelo = mk('path', { d: suelo(), fill: NOCHE }, S.paisaje);
  S.arbol = araucaria(S.paisaje, { x: a3.x, suelo: L.s3.suelo, h: a3.h }, NOCHE);
  construirMedicion();

  // Lluvia fina
  S.lluvia = mk('g', { stroke: C.papel, 'stroke-width': 2, 'stroke-linecap': 'round', opacity: 0 }, svg);
  const rl = mulberry32(21);
  S.gotas = Array.from({ length: 70 }, () => ({ x: rl() * L.W * 1.1 - L.W * 0.1, y: rl() * L.H, v: 1100 + rl() * 500, l: 26 + rl() * 22, p: mk('line', null, S.lluvia) }));

  // Nota de campo, titulares y rótulos
  S.nota = construirNota();
  S.titular3 = bloqueTitular(svg, L.s3.titular);
  construirFichas(svg);
  construirEnlaces(svg);
  construirProyecto(svg);
  construirFoto(svg);
  S.titular6 = bloqueTitular(svg, L.titular6);
  construirRotulo(svg);
  construirLogo(svg);

  // Destinos del logo para las curvas
  const V = VARIANTES[L.logo.variante];
  const esc = L.logo.ancho / V.w;
  const x0 = L.logo.cx - (V.w * esc) / 2, y0 = L.logo.cy - (V.h * esc) / 2;
  const mm = V.monteM;
  const subs = MONTE.match(/M[^M]+/g);
  const matMonte = [esc * mm[0], x0 + mm[1] * esc, y0 + mm[2] * esc];
  S.destMonte = contornoLogo(subs[1], matMonte);
  S.destCirculo = contornoLogo(subs[0], matMonte);
}

function reticula(paso) {
  let d = '';
  for (let x = paso; x < L.W; x += paso) d += `M${x},0V${L.H}`;
  for (let y = paso; y < L.H; y += paso) d += `M0,${y}H${L.W}`;
  return d;
}

function construirSilueta() {
  // Borde exterior de la pila de curvas del plano 2, suavizado, más la nieve
  // de la cumbre (el Villarrica tiene casquete glaciar).
  const V = L.volcan;
  const izq = [], der = [];
  for (let k = 0; k < N; k++) {
    const P = ptsVolcan(k, V);
    let a = P[0], b = P[0];
    for (const q of P) { if (q[0] < a[0]) a = q; if (q[0] > b[0]) b = q; }
    izq.push(a); der.push(b);
  }
  const tope = ptsVolcan(N - 1, V).filter((q, j) => Math.sin(TH[j]) < 0).sort((p, q) => p[0] - q[0]);
  const base = V.by + 260;
  const contorno = [[izq[0][0], base], ...izq, ...tope, ...der.slice().reverse(), [der[0][0], base]];
  mk('path', { d: curva(contorno, true), fill: C.azul, opacity: 0.62 }, S.lejos);
  const s = 9; // curva donde empieza la nieve
  const frente = ptsVolcan(s, V).filter((q, j) => Math.sin(TH[j]) >= 0).sort((p, q) => q[0] - p[0]);
  const nieve = [...izq.slice(s), ...tope, ...der.slice(s).reverse(), ...frente];
  mk('path', { d: poligono(nieve), fill: C.papel, opacity: 0.26 }, S.lejos);
}

function construirBosque() {
  // Bosque templado en silueta: copas redondeadas y algunos coigües emergentes
  // con la copa en pisos. Tono intermedio entre la niebla y la araucaria.
  const rnd = mulberry32(31);
  const base = L.s3.suelo, tope = L.s3.bosque;
  const formas = [];
  for (let x = -60; x < L.W + 60;) {
    const r = 22 + rnd() * 34;
    formas.push({ cx: x, cy: tope + (base - tope) * (0.15 + rnd() * 0.45) + r * 0.3, rx: r * 1.15, ry: r });
    x += r * (1.0 + rnd() * 0.6);
  }
  for (let e = 0; e < 4; e++) {
    const cx = L.W * (0.06 + 0.25 * e + rnd() * 0.1), alto = 40 + rnd() * 40;
    for (let c = 0; c < 5; c++) formas.push({ cx: cx + (rnd() - 0.5) * 90, cy: tope - alto + rnd() * 50, rx: 36 + rnd() * 26, ry: 18 + rnd() * 10 });
  }
  const pts = [];
  for (let x = -20; x <= L.W + 20; x += 6) {
    let y = base + 20;
    for (const f of formas) {
      const u = Math.abs((x - f.cx) / f.rx);
      if (u < 1) y = Math.min(y, f.cy - f.ry * Math.sqrt(1 - u * u));
      else if (u < 2.5) y = Math.min(y, f.cy + (u - 1) * f.ry * 1.6);
    }
    pts.push([x, y]);
  }
  S.bosque = mk('path', { d: poligono([...pts, [L.W + 20, L.H + 20], [-20, L.H + 20]]), fill: C.azul }, S.paisaje);
  // Una capa de niebla clara delante del bosque y detrás de la araucaria
  const lg = mk('linearGradient', { id: 'nieblaBosque', x1: 0, y1: 0, x2: 0, y2: 1 }, S.defs);
  mk('stop', { offset: 0, 'stop-color': C.papel, 'stop-opacity': 0 }, lg);
  mk('stop', { offset: 0.5, 'stop-color': C.papel, 'stop-opacity': 0.13 }, lg);
  mk('stop', { offset: 1, 'stop-color': C.papel, 'stop-opacity': 0.05 }, lg);
  S.nieblaBosque = mk('rect', { x: -L.W * 0.3, y: tope - 30, width: L.W * 1.6, height: base - tope + 60, fill: 'url(#nieblaBosque)' }, S.paisaje);
}
function suelo() {
  const pts = [];
  for (let x = -20; x <= L.W + 20; x += 20) pts.push([x, L.s3.suelo + 5 * Math.sin(x / 260) + 3 * Math.sin(x / 90)]);
  return curva(pts, false) + `L${L.W + 20},${L.H + 20}L-20,${L.H + 20}Z`;
}

/* Araucaria araucana adulta en contraluz: fuste limpio, copa en paraguas con
   ramas en verticilos que suben en la punta. Se dibuja a escala: 28 m de alto,
   1,2 m de diámetro a la altura del pecho (1,3 m). */
function araucaria(parent, o, color) {
  const g = mk('g', { fill: color }, parent);
  const pxm = o.h / 28, dap = 1.2 * pxm;
  const topeY = o.suelo - o.h * 0.975;
  const izq = [], der = [];
  for (let i = 0; i <= 24; i++) {
    const s = i / 24, y = lerp(o.suelo + 8, topeY, s);
    let w = lerp(dap * 1.04, dap * 0.4, Math.pow(s, 0.9));
    if (s < 0.035) w *= 1 + ((0.035 - s) / 0.035) * 0.5;
    izq.push([o.x - w / 2, y]); der.push([o.x + w / 2, y]);
  }
  mk('path', { d: poligono([...izq, ...der.reverse()]) }, g);
  const rnd = mulberry32(11);
  // [altura relativa, largo relativo]: la copa es un paraguas, casi plana arriba.
  const verticilos = [[0.7, 0.2], [0.765, 0.28], [0.825, 0.32], [0.88, 0.335], [0.93, 0.31], [0.975, 0.24]];
  for (const [hf, sf] of verticilos) {
    const y = o.suelo - hf * o.h, Lr = sf * o.h, w0 = o.h * lerp(0.036, 0.027, (hf - 0.7) / 0.28);
    rama(g, o.x, y, 1, Lr * (0.94 + rnd() * 0.12), w0, 0, rnd);
    rama(g, o.x, y, -1, Lr * (0.94 + rnd() * 0.12), w0, 0, rnd);
    // Ramas que apuntan hacia quien mira o se alejan: se ven más cortas.
    rama(g, o.x, y - 5, rnd() < 0.5 ? 1 : -1, Lr * (0.38 + rnd() * 0.14), w0 * 0.9, 0.7, rnd);
  }
  return { g, pxm, dap };
}
function rama(g, x, y, dir, Lr, w0, alza, rnd) {
  // Sale casi horizontal, cede un poco con el peso y levanta la punta.
  const P = [[x, y], [x + dir * 0.36 * Lr, y + 0.06 * Lr - alza * 0.18 * Lr], [x + dir * 0.74 * Lr, y + 0.07 * Lr - alza * 0.36 * Lr], [x + dir * Lr, y - 0.16 * Lr - alza * 0.42 * Lr]];
  const bz = (s, i) => { const u = 1 - s; return u * u * u * P[0][i] + 3 * u * u * s * P[1][i] + 3 * u * s * s * P[2][i] + s * s * s * P[3][i]; };
  const bzD = (s, i) => { const u = 1 - s; return 3 * u * u * (P[1][i] - P[0][i]) + 6 * u * s * (P[2][i] - P[1][i]) + 3 * s * s * (P[3][i] - P[2][i]); };
  const fase = rnd() * 3;
  // Las hojas escamosas cubren toda la rama: se ve como una cuerda gruesa y grumosa.
  const ancho = (s) => w0 * (0.55 + 0.45 * (1 - s)) * (1 + 0.3 * Math.abs(Math.sin(s * Math.PI * 4.5 + fase))) * (s < 0.08 ? 0.6 + s * 5 : 1);
  tubo(g, (s) => [bz(s, 0), bz(s, 1)], (s) => [bzD(s, 0), bzD(s, 1)], ancho, 36);
}
function tubo(g, pos, der, ancho, n) {
  const A = [], B = [];
  for (let i = 0; i <= n; i++) {
    const s = i / n, p = pos(s), d = der(s), l = Math.hypot(d[0], d[1]) || 1, nx = -d[1] / l, ny = d[0] / l, w = ancho(s) / 2;
    A.push([p[0] + nx * w, p[1] + ny * w]); B.push([p[0] - nx * w, p[1] - ny * w]);
  }
  mk('path', { d: poligono([...A, ...B.reverse()]) }, g);
  const pf = pos(1);
  mk('circle', { cx: f1(pf[0]), cy: f1(pf[1]), r: f1(ancho(1) / 2) }, g);
}
function construirMedicion() {
  const a = L.s3.arbol, pxm = S.arbol.pxm, dap = S.arbol.dap;
  const yCopa = L.s3.suelo - 0.62 * a.h, yDap = L.s3.suelo - 1.3 * pxm, xCinta = a.x - dap / 2 - 26;
  const g = mk('g', { stroke: C.naranjo, 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none' }, S.paisaje);
  const cinta = mk('line', { x1: xCinta, y1: yCopa, x2: xCinta, y2: yCopa }, g);
  const tope = mk('line', { x1: xCinta - 10, y1: yCopa, x2: xCinta + 10, y2: yCopa }, g);
  const marcas = [];
  for (let m = 2; m <= 16; m += 2) { const y = L.s3.suelo - m * pxm; marcas.push({ y, p: mk('line', { x1: xCinta - 16, y1: y, x2: xCinta, y2: y, opacity: 0 }, g) }); }
  // La cinta dobla en 1,3 m y cruza el tronco: el diámetro a la altura del pecho.
  const compas = mk('path', { d: `M${xCinta},${yDap}H${a.x + dap / 2}M${a.x - dap / 2},${yDap - 12}V${yDap + 12}M${a.x + dap / 2},${yDap - 12}V${yDap + 12}` }, g);
  S.medicion = { g, cinta, tope, marcas, compas, Lc: largo(compas), xCinta, yCopa, yDap };
}

function construirNota() {
  // Etiqueta de ejemplar: nombre científico y el dato medido.
  const n = L.s3.nota, g = mk('g', { opacity: 0 }, $('#stage'));
  // REQUIERE CONSULTA PREVIA A LA COMUNIDAD: nombre en mapuzugun del catálogo de la
  // plataforma, en la misma línea y con el mismo cuerpo que el nombre científico.
  const especie = CONSULTA.nombresMapuzugun ? '*Araucaria araucana* · pewen' : '*Araucaria araucana*';
  const lineas = [[especie, 48, C.papel], ['Ø 1,2 m', 60, C.crema]];
  let y = n.y, maxW = 0;
  const textos = lineas.map(([s, size, fill], i) => {
    if (i > 0) y += size * 1.12;
    const t = texto(g, s, { x: n.x, y, size, fill, anchor: n.anchor });
    maxW = Math.max(maxW, ancho(t));
    return t;
  });
  const m = S.medicion;
  const fin = n.anchor === 'end' ? [n.x + 14, n.y - 44] : [n.x + maxW + 16, n.y - 44];
  const guia = mk('path', { d: `M${m.xCinta - 8},${m.yDap + 8}L${fin[0]},${fin[1]}`, stroke: C.papel, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, $('#stage'));
  return { g, textos, guia, Lg: largo(guia) };
}

function bloqueTitular(parent, o) {
  const g = mk('g', { opacity: 0 }, parent);
  const lineas = o.lineas.map((s, i) => texto(g, s, { x: o.x, y: o.y + i * o.size * 0.88, size: o.size, fam: 'archivo', fill: C.crema }));
  return { g, lineas };
}

function construirFichas(parent) {
  const F = L.fichas, w = F.w, pad = 34, ilW = w - 2 * pad, ilH = Math.round(ilW * 0.62), ilY = pad + 70;
  S.fichasG = mk('g', null, parent);
  S.fichas = FICHAS.map((datos, i) => {
    const g = mk('g', { opacity: 0 }, S.fichasG);
    const sombra = mk('rect', { x: 0, y: 0, width: w, height: 10, rx: 16, fill: NOCHE, opacity: 0.35 }, g);
    const fondo = mk('rect', { x: 0, y: 0, width: w, height: 10, rx: 16, fill: C.acuarela }, g);
    const textos = [];
    textos.push(texto(g, datos.n, { x: pad, y: pad + 42, size: 48, fill: C.azulMedio }));
    // Marco con retícula milimetrada
    let dRet = '';
    for (let x = pad + 24; x < pad + ilW; x += 24) dRet += `M${x},${ilY}V${ilY + ilH}`;
    for (let y = ilY + 24; y < ilY + ilH; y += 24) dRet += `M${pad},${y}H${pad + ilW}`;
    mk('path', { d: dRet, stroke: C.azulMedio, 'stroke-opacity': 0.14, 'stroke-width': 1.5, fill: 'none' }, g);
    mk('rect', { x: pad, y: ilY, width: ilW, height: ilH, fill: 'none', stroke: C.azulMedio, 'stroke-opacity': 0.4, 'stroke-width': 2 }, g);
    const dib = mk('g', { 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    const trazos = [], rellenos = [];
    const anchos = [];
    let corona = null;
    for (const t of DIBUJOS[datos.dibujo]()) {
      if (t.relleno) {
        const p = mk('path', { d: t.d, fill: t.relleno, opacity: 0 }, dib);
        rellenos.push(p);
        if (t.corona) corona = p;
      } else {
        const p = mk('path', { d: t.d, fill: 'none', stroke: C.azul, 'stroke-opacity': t.opacidad || 1 }, dib);
        trazos.push({ p, L: largo(p) });
        anchos.push(t.w || 3);
      }
    }
    // Encaja el dibujo en el marco según lo que ocupa de verdad, con aire alrededor.
    const bb = dib.getBBox(), aire = 22;
    const fz = Math.min((ilW - 2 * aire) / bb.width, (ilH - 2 * aire) / bb.height);
    dib.setAttribute('transform', `translate(${f1(pad + ilW / 2 - (bb.x + bb.width / 2) * fz)} ${f1(ilY + ilH / 2 - (bb.y + bb.height / 2) * fz)}) scale(${fz.toFixed(4)})`);
    trazos.forEach((tr, k) => tr.p.setAttribute('stroke-width', f1((anchos[k] * 1.15) / fz)));
    let y = ilY + ilH + 78;
    datos.titulo.forEach((s, k) => { if (k) y += 58; textos.push(texto(g, s, { x: pad, y, size: 64, fam: 'archivo', fill: C.azul })); });
    datos.cientifico.forEach((s, k) => { y += k ? 54 : 62; textos.push(texto(g, s, { x: pad, y, size: 48, fill: C.azulMedio })); });
    // REQUIERE CONSULTA PREVIA A LA COMUNIDAD: nombre local en mapuzugun (pewen, pigda, chumaihuén).
    // «pancora» es castellano de Chile y no se muestra: la ficha ya lleva su nombre científico.
    if (CONSULTA.nombresMapuzugun && datos.dibujo !== 'estero') { y += 54; textos.push(texto(g, datos.local, { x: pad, y, size: 48, fill: C.azul })); }
    for (const t of textos) { const aw = ancho(t); if (aw > ilW + 2) console.warn('Texto más ancho que la ficha:', t.textContent, Math.round(aw)); }
    return { g, sombra, fondo, textos, trazos, rellenos, corona, alto: y + 40, altoChip: ilY + ilH + pad, w };
  });
  const alto = Math.max(...S.fichas.map((f) => f.alto));
  S.fichas.forEach((f) => { f.alto = alto; });
}

function construirEnlaces(parent) {
  S.enlacesG = mk('g', { fill: 'none', stroke: C.papel, 'stroke-width': 3, 'stroke-linecap': 'round' }, parent);
  const n = L.nodo;
  S.lineas = L.chips.pos.map((pos) => {
    const f = S.fichas[0], s = L.chips.s;
    let a, d;
    if (L.chips.lado === 'derecha') { a = [pos[0] + (f.w * s) / 2 + 8, pos[1]]; d = `M${a[0]},${a[1]}C${a[0] + 150},${a[1]} ${n.x - 170},${n.y} ${n.x},${n.y}`; }
    else { a = [pos[0], pos[1] + (f.altoChip * s) / 2 + 8]; d = `M${a[0]},${a[1]}C${a[0]},${a[1] + 120} ${n.x},${n.y - 150} ${n.x},${n.y}`; }
    const p = mk('path', { d }, S.enlacesG);
    const o = mk('circle', { cx: a[0], cy: a[1], r: 6, fill: C.papel, stroke: 'none', opacity: 0 }, S.enlacesG);
    return { p, o, L: largo(p) };
  });
  const P = L.proyecto;
  const dE = L.chips.lado === 'derecha' ? `M${n.x + n.r},${n.y}H${P.x - 4}` : `M${n.x},${n.y + n.r}V${P.y - 4}`;
  S.enlace = mk('path', { d: dE }, S.enlacesG);
  S.Lenlace = largo(S.enlace);
  S.nodo = mk('circle', { cx: n.x, cy: n.y, r: n.r, fill: C.azul, 'stroke-width': 5 }, S.enlacesG);
  S.Lnodo = 2 * Math.PI * n.r;
  S.punto = mk('circle', { cx: n.x, cy: n.y, r: 11, fill: C.naranjo, stroke: 'none', opacity: 0 }, S.enlacesG);
}

function construirProyecto(parent) {
  const P = L.proyecto, pad = P.pad;
  const clip = mk('clipPath', { id: 'corteProyecto' }, S.defs);
  S.corte = mk('rect', { x: P.x, y: P.y, width: 0, height: 0 }, clip);
  const g = mk('g', { 'clip-path': 'url(#corteProyecto)' }, parent);
  const fondo = mk('rect', { x: P.x, y: P.y, width: P.w, height: 10, rx: 16, fill: C.crema }, g);
  const t = [];
  let y = P.y + pad + 40;
  t.push(texto(g, 'Proyecto Nº 07', { x: P.x + pad, y, size: 48, fill: C.azulMedio }));
  y += P.titulo * 1.08;
  t.push(texto(g, 'Caudal del', { x: P.x + pad, y, size: P.titulo, fam: 'archivo', fill: C.azul }));
  y += P.titulo * 0.88;
  t.push(texto(g, 'estero', { x: P.x + pad, y, size: P.titulo, fam: 'archivo', fill: C.azul }));
  y += 86;
  t.push(texto(g, '5º a 8º básico', { x: P.x + pad, y, size: 60, fill: C.azul }));
  y += 44;
  const regla = mk('path', { d: `M${P.x + pad},${y}H${P.x + P.w - pad}`, stroke: C.ocre, 'stroke-width': 3 }, g);
  // Dos fuentes con el mismo peso tipográfico: la medición y lo que sabe la comunidad.
  y += 80;
  const fila = (etiqueta, resto, yy) => {
    const ge = mk('g', null, g);
    const a = texto(ge, etiqueta, { x: P.x + pad, y: yy, size: 48, fam: 'archivo', fill: C.azul });
    texto(ge, resto, { x: P.x + pad + ancho(a) + 26, y: yy, size: 50, fill: C.azul });
    return ge;
  };
  t.push(fila('Medir', '*Q* = *v* · *A*', y));
  y += 70;
  t.push(fila('Escuchar', 'saberes de la comunidad', y));
  const alto = y - P.y + pad;
  fondo.setAttribute('height', alto);
  S.proyecto = { g, textos: t, regla, alto };
}

function construirFoto(parent) {
  // REQUIERE CONSULTA PREVIA A LA COMUNIDAD y consentimiento informado.
  // Marcador de producción: describe la foto que habría que tomar.
  S.foto = null;
  if (!CONSULTA.fotoEstudiantes) return;
  const F = L.foto;
  const g = mk('g', { opacity: 0, transform: `rotate(${F.rot} ${F.x + F.w / 2} ${F.y + F.h / 2})` }, parent);
  mk('rect', { x: F.x, y: F.y, width: F.w, height: F.h, fill: C.acuarela, stroke: C.azulMedio, 'stroke-width': 3, 'stroke-dasharray': '14 10', rx: 10 }, g);
  const lineas = ['FOTO POR PRODUCIR', 'Estudiantes y su docente miden el ancho y la', 'profundidad del estero. Luz nublada, sin posar.'];
  lineas.forEach((s, i) => texto(g, s, { x: F.x + 28, y: F.y + 48 + i * 44, size: i ? 34 : 30, fill: C.azul }));
  S.foto = g;
}

function construirRotulo(parent) {
  const g = mk('g', { opacity: 0 }, parent);
  const guia = mk('path', { d: 'M0,0', stroke: C.papel, 'stroke-width': 2.5, fill: 'none', 'stroke-linecap': 'round' }, g);
  // REQUIERE CONSULTA PREVIA A LA COMUNIDAD: «Rukapillán» figura en data/araucania/pois.json de la plataforma.
  const nombreA = texto(g, CONSULTA.nombresMapuzugun ? 'Rukapillán · Villarrica' : 'Volcán Villarrica', { x: 0, y: 0, size: 48, fill: C.papel });
  const nombreB = texto(g, 'Rio de Janeiro', { x: 0, y: 0, size: 48, fill: C.papel, });
  const coord = texto(g, '39° 25′ S', { x: 0, y: 0, size: 48, fill: C.papel });
  coord.setAttribute('font-variant-numeric', 'tabular-nums');
  S.rotulo = { g, guia, nombreA, nombreB, coord };
}

function construirLogo(parent) {
  const V = VARIANTES[L.logo.variante];
  const esc = L.logo.ancho / V.w;
  const x0 = L.logo.cx - (V.w * esc) / 2, y0 = L.logo.cy - (V.h * esc) / 2;
  const g = mk('g', { transform: `translate(${f1(x0)} ${f1(y0)}) scale(${esc})` }, parent);
  const monte = mk('path', { d: MONTE, fill: COLOR_LOGO, 'fill-rule': 'evenodd', transform: V.monte, opacity: 0 }, g);
  const gp = mk('g', { transform: V.palabra }, g);
  const subs = PALABRA.match(/M[^M]+/g);
  const aprende = subs.filter((s) => parseFloat(s.split(/[ C]/)[1]) < 30).join('');
  const local = subs.filter((s) => parseFloat(s.split(/[ C]/)[1]) >= 30).join('');
  const pA = mk('path', { d: aprende, fill: COLOR_LOGO, 'fill-rule': 'evenodd', opacity: 0 }, gp);
  const pL = mk('path', { d: local, fill: COLOR_LOGO, 'fill-rule': 'evenodd', opacity: 0 }, gp);
  const punto = mk('circle', { cx: PUNTO_O.cx, cy: PUNTO_O.cy, r: PUNTO_O.r, fill: C.naranjo, opacity: 0 }, gp);
  S.logo = { g, monte, pA, pL, punto, esc };
}

/* ==========================================================================
   Render: un cuadro exacto para el tiempo t
   ========================================================================== */
function render(t) {
  tActual = t;
  // Fondo: negro azulado que se abre al azul de marca
  const velo = 0.7 * (1 - ez(t, T.velo[0], T.velo[1]));
  const colorFondo = mezcla(C.azul, '#000000', velo);
  S.fondo.setAttribute('fill', colorFondo);

  const cielo = ventana(t, T.s3Cambio[0], T.s3Cambio[1], T.s3Salida[0], T.s3Salida[1]);
  S.cielo.setAttribute('opacity', cielo);

  renderCurvas(t, colorFondo);
  renderNiebla(t);
  renderPaisaje(t);
  renderLluvia(t);
  renderRotulo(t);

  const r = ventana(t, T.s4Reticula[0], T.s4Reticula[1], T.s4Reticula[2], T.s4Reticula[3]);
  S.reticula.setAttribute('opacity', r);
  renderFichas(t);
  renderProyecto(t);
  renderTitular(S.titular3, t, T.s3Titular);
  renderTitular(S.titular6, t, T.s6Titular);
  renderLogo(t);
}

function renderCurvas(t, colorFondo) {
  const visibles = t < 7.6 || t >= 19.0;
  S.curvasG.setAttribute('display', visibles ? 'inline' : 'none');
  if (!visibles) return;
  const G = S.geo;
  let opGrupo = 1, rellenoOp = 1, transform = '';
  if (t < 19) {
    opGrupo = 1 - ez(t, 6.9, 7.5);
    const u = ez(t, T.s3Cambio[0], T.s3Cambio[1]), R = L.retrae;
    if (u > 0) {
      const s = lerp(1, R.s, u), tx = lerp(L.volcan.cx, R.x, u), ty = lerp(L.volcan.by, R.y, u);
      transform = `translate(${f1(tx)} ${f1(ty)}) scale(${s}) translate(${-L.volcan.cx} ${-L.volcan.by})`;
    }
  } else {
    opGrupo = ez(t, T.s6Entrada[0], T.s6Entrada[1]) * (1 - ez(t, 22.8, 23.15));
    rellenoOp = 1 - ez(t, 21.8, 22.2);
  }
  S.curvasG.setAttribute('opacity', opGrupo);
  S.curvasG.setAttribute('transform', transform);
  for (let k = 0; k < N; k++) {
    const c = S.curvas[k];
    let pts;
    if (t < 19) {
      const a = T.s2Alza.t0 + k * T.s2Alza.paso;
      pts = lerpPts(G.planos[k], G.volcanes[k], ez(t, a, a + T.s2Alza.dur));
      const prog = k === 0 ? ez(t, T.s1Linea[0], T.s1Linea[1]) : ez(t, T.s2Anillos.t0 + (k - 1) * T.s2Anillos.paso, T.s2Anillos.t0 + (k - 1) * T.s2Anillos.paso + T.s2Anillos.dur);
      dibujaTrazo(c.p, c.L, prog);
      c.p.setAttribute('visibility', prog > 0 ? 'visible' : 'hidden');
    } else {
      const a = T.s6Morph.t0 + k * T.s6Morph.paso;
      pts = lerpPts(G.volcanes6[k], G.morros[k], ez(t, a, a + T.s6Morph.dur));
      const b = T.s7Anida.t0 + k * T.s7Anida.paso, u = ez(t, b, b + T.s7Anida.dur);
      if (u > 0) pts = lerpPts(pts, destinoLogo(k), u);
      dibujaTrazo(c.p, c.L, 1);
      c.p.setAttribute('visibility', 'visible');
      // Las líneas de la bahía no forman el monte: se retiran antes.
      c.p.setAttribute('stroke-opacity', k < 3 ? 1 - ez(t, 21.55, 21.95) : 1);
    }
    set(c.p, { d: curva(pts, true), fill: colorFondo, 'fill-opacity': rellenoOp });
  }
}
/* Las curvas del morro caen, una tras otra, sobre el contorno oficial del
   monte (3 a 10) y del círculo (11 a 15). Después el logo relleno las reemplaza. */
function destinoLogo(k) {
  return (k < 11 ? S.destMonte : S.destCirculo).pts;
}

function renderNiebla(t) {
  const salida = 1 - ez(t, T.s3Salida[0], T.s3Salida[1]);
  S.nieblas.forEach(({ p, n }, i) => {
    const a = T.s2Niebla.t0 + i * T.s2Niebla.paso, e = ez(t, a, a + T.s2Niebla.dur);
    const tx = n.desde * (1 - e) * L.W * 0.25 - n.desde * (t - a) * 10;
    const retiro = ez(t, T.s3Cambio[0], T.s3Cambio[1]) * 30;
    p.setAttribute('transform', `translate(${f1(tx)} ${f1(retiro)})`);
    p.setAttribute('opacity', e * salida);
  });
}

function renderPaisaje(t) {
  const visible = t > 6.8 && t < 11.7;
  S.lejos.setAttribute('display', visible ? 'inline' : 'none');
  S.paisaje.setAttribute('display', visible ? 'inline' : 'none');
  S.nota.g.setAttribute('display', visible ? 'inline' : 'none');
  S.nota.guia.setAttribute('display', visible ? 'inline' : 'none');
  if (!visible) return;
  const R = L.retrae, u = ez(t, T.s3Cambio[0], T.s3Cambio[1]);
  const s = lerp(1, R.s, u), tx = lerp(L.volcan.cx, R.x, u), ty = lerp(L.volcan.by, R.y, u);
  const salida = 1 - ez(t, T.s3Salida[0], T.s3Salida[1]);
  S.lejos.setAttribute('transform', `translate(${f1(tx)} ${f1(ty + (1 - salida) * 30)}) scale(${s}) translate(${-L.volcan.cx} ${-L.volcan.by})`);
  S.lejos.setAttribute('opacity', ez(t, 6.9, 7.5) * salida);
  const entra = ez(t, T.s3Cambio[0], T.s3Cambio[1]);
  S.paisaje.setAttribute('opacity', entra * salida);
  S.paisaje.setAttribute('transform', `translate(0 ${f1((1 - entra) * 40 + (1 - salida) * 40)})`);
  // La araucaria aparece desde la niebla
  S.arbol.g.setAttribute('opacity', ez(t, T.s3Arbol[0], T.s3Arbol[1]));
  const deriva = (t - 7) * 14;
  S.nieblaBosque.setAttribute('transform', `translate(${f1(deriva)} 0)`);
  // Medición: la cinta baja por el tronco, marca cada 2 m y dobla en 1,3 m
  const m = S.medicion, pc = ez(t, T.s3Cinta[0], T.s3Cinta[1]);
  const y = lerp(m.yCopa, m.yDap, pc);
  m.cinta.setAttribute('y2', f1(y));
  m.cinta.setAttribute('opacity', pc > 0 ? 1 : 0);
  m.tope.setAttribute('opacity', pc > 0 ? 1 : 0);
  for (const mk_ of m.marcas) mk_.p.setAttribute('opacity', pc > 0 ? clamp((y - mk_.y) / 14) : 0);
  const pcomp = ez(t, T.s3Compas[0], T.s3Compas[1]);
  dibujaTrazo(m.compas, m.Lc, pcomp);
  m.compas.setAttribute('opacity', pcomp > 0 ? 1 : 0);
  const pn = ez(t, T.s3Nota[0], T.s3Nota[1]);
  dibujaTrazo(S.nota.guia, S.nota.Lg, pn);
  S.nota.guia.setAttribute('opacity', (pn > 0 ? 1 : 0) * salida);
  S.nota.g.setAttribute('opacity', ez(t, T.s3Nota[0] + 0.15, T.s3Nota[1] + 0.15) * salida);
}

function renderLluvia(t) {
  const op = ventana(t, 4.8, 5.8, 9.0, 9.6) * 0.16;
  S.lluvia.setAttribute('opacity', op);
  if (op <= 0) return;
  for (const g of S.gotas) {
    const y = ((g.y + g.v * t) % (L.H + 120)) - 60, x = g.x + y * 0.18;
    set(g.p, { x1: f1(x), y1: f1(y), x2: f1(x + g.l * 0.18), y2: f1(y + g.l) });
  }
}

function cumbre() {
  const P = S.curvas[N - 1].p.getAttribute('d').match(/-?\d+(\.\d+)?,-?\d+(\.\d+)?/g).map((s) => s.split(',').map(Number));
  return P.reduce((a, b) => (b[1] < a[1] ? b : a));
}
function renderRotulo(t) {
  const R = S.rotulo;
  const en2 = ventana(t, T.s2Rotulo[0], T.s2Rotulo[1], T.s2Rotulo[2], T.s2Rotulo[3]);
  const en6 = ventana(t, T.s6Rotulo[0], T.s6Rotulo[1], T.s6Rotulo[2], T.s6Rotulo[3]);
  const op = Math.max(en2, en6);
  R.g.setAttribute('opacity', op);
  if (op <= 0) return;
  const c = cumbre();
  const cfg = t < 12 ? L.rotulo2 : L.rotulo6;
  const sg = cfg.anchor === 'start' ? 1 : -1;
  const ax = c[0] + cfg.dx, ay = c[1] + cfg.dy;
  for (const e of [R.nombreA, R.nombreB, R.coord]) set(e, { x: f1(ax), 'text-anchor': cfg.anchor });
  set(R.nombreA, { y: f1(ay - 58) }); set(R.nombreB, { y: f1(ay - 58) }); set(R.coord, { y: f1(ay) });
  R.guia.setAttribute('d', `M${f1(c[0] + sg * 8)},${f1(c[1] - 8)}L${f1(ax - sg * 14)},${f1(ay - 30)}`);
  // Plano 6: el nombre cambia y la latitud corre de 39° 25′ S a 22° 54′ S
  const v = t < 12 ? 0 : ez(t, T.s6Morph.t0, T.s6Morph.t0 + T.s6Morph.dur);
  R.nombreA.setAttribute('opacity', 1 - clamp((v - 0.35) / 0.3));
  R.nombreB.setAttribute('opacity', clamp((v - 0.35) / 0.3));
  const min = Math.round(lerp(39 * 60 + 25, 22 * 60 + 54, v));
  R.coord.textContent = `${Math.floor(min / 60)}° ${String(min % 60).padStart(2, '0')}′ S`;
}

function renderFichas(t) {
  const F = L.fichas, CH = L.chips;
  const visible = t > 11 && t < 19.5;
  S.fichasG.setAttribute('display', visible ? 'inline' : 'none');
  S.enlacesG.setAttribute('display', visible ? 'inline' : 'none');
  if (S.foto) S.foto.setAttribute('opacity', ventana(t, 17.2, 17.7, T.s5Salida[0], T.s5Salida[1]));
  if (!visible) return;
  const comp = ez(t, T.s5Compacta[0], T.s5Compacta[1]);
  const salida = 1 - ez(t, T.s5Salida[0], T.s5Salida[1]);
  S.fichas.forEach((f, i) => {
    const a = T.s4Fichas.t0 + i * T.s4Fichas.paso, e = ez(t, a, a + T.s4Fichas.dur);
    const [cx, top, rot] = F.pos[i], [chx, chy, chr] = CH.pos[i];
    const h = lerp(f.alto, f.altoChip, comp);
    // Entra como sticker: baja, gira y se asienta; la sombra se acorta al pegarse.
    const x = lerp(cx, chx, comp), y = lerp(top + f.alto / 2 + (1 - e) * 70, chy, comp) - salida * 0 - (1 - salida) * 20;
    const r = lerp(rot + (1 - e) * 5, chr, comp), s = lerp(1 + (1 - e) * 0.05, CH.s, comp);
    f.g.setAttribute('transform', `translate(${f1(x)} ${f1(y)}) rotate(${f1(r)}) scale(${s.toFixed(4)}) translate(${-f.w / 2} ${f1(-h / 2)})`);
    f.g.setAttribute('opacity', Math.min(ez(t, a, a + 0.35), salida));
    f.fondo.setAttribute('height', f1(h));
    set(f.sombra, { height: f1(h), x: f1(lerp(18, 8, e)), y: f1(lerp(26, 12, e)), opacity: lerp(0.18, 0.35, e) });
    const opTexto = 1 - lin(t, T.s5Compacta[0], T.s5Compacta[0] + 0.3);
    f.textos.forEach((tx) => tx.setAttribute('opacity', opTexto));
    const d0 = T.s4Dibujo.t0 + i * T.s4Dibujo.paso, pd = ez(t, d0, d0 + T.s4Dibujo.dur);
    f.trazos.forEach((tr) => dibujaTrazo(tr.p, tr.L, pd));
    f.rellenos.forEach((p) => { if (p !== f.corona) p.setAttribute('opacity', ez(t, d0 + 1.0, d0 + 1.3)); });
    if (f.corona) {
      f.corona.setAttribute('opacity', ez(t, T.s4Corona[0], T.s4Corona[1]));
      // En el plano 5 el foco naranjo pasa al nodo; la corona queda en ocre.
      f.corona.setAttribute('fill', mezcla(C.naranjo, C.ocre, ez(t, 15.0, 15.5)));
    }
  });
  // Enlaces: líneas finas que convergen en un nodo; del nodo sale el proyecto.
  S.lineas.forEach((l, i) => {
    const a = T.s5Lineas.t0 + i * T.s5Lineas.paso, p = ez(t, a, a + T.s5Lineas.dur);
    dibujaTrazo(l.p, l.L, p);
    l.p.setAttribute('opacity', (p > 0 ? 1 : 0) * salida);
    l.o.setAttribute('opacity', ez(t, a, a + 0.2) * salida);
  });
  const pn = ez(t, T.s5Nodo[0], T.s5Nodo[1]);
  set(S.nodo, { stroke: C.papel, 'stroke-dasharray': `${S.Lnodo} ${S.Lnodo}`, 'stroke-dashoffset': f1(S.Lnodo * (1 - pn)), opacity: (pn > 0 ? 1 : 0) * salida });
  S.punto.setAttribute('opacity', ez(t, T.s5Punto[0], T.s5Punto[1]) * salida);
  const pe = ez(t, T.s5Enlace[0], T.s5Enlace[1]);
  dibujaTrazo(S.enlace, S.Lenlace, pe);
  S.enlace.setAttribute('opacity', (pe > 0 ? 1 : 0) * salida);
}

function renderProyecto(t) {
  const P = L.proyecto, pr = S.proyecto;
  const e = ez(t, T.s5Ficha[0], T.s5Ficha[1]);
  const salida = 1 - ez(t, T.s5Salida[0], T.s5Salida[1]);
  pr.g.setAttribute('opacity', salida);
  pr.g.setAttribute('transform', `translate(0 ${f1(-(1 - salida) * 20)})`);
  if (L.chips.lado === 'derecha') set(S.corte, { x: P.x, y: P.y - 20, width: f1(P.w * e), height: pr.alto + 40 });
  else set(S.corte, { x: P.x - 20, y: P.y, width: P.w + 40, height: f1(pr.alto * e) });
  pr.textos.forEach((tx, i) => {
    const a = T.s5Textos.t0 + i * T.s5Textos.paso, u = ez(t, a, a + T.s5Textos.dur);
    tx.setAttribute('opacity', u);
    tx.setAttribute('transform', `translate(0 ${f1((1 - u) * 16)})`);
  });
  pr.regla.setAttribute('opacity', ez(t, T.s5Textos.t0 + 0.4, T.s5Textos.t0 + 0.9));
}

function renderTitular(b, t, v) {
  const op = ventana(t, v[0], v[1], v[2], v[3]);
  b.g.setAttribute('opacity', op > 0 ? 1 : 0);
  if (op <= 0) return;
  b.lineas.forEach((ln, i) => {
    const u = ez(t, v[0] + i * 0.08, v[1] + i * 0.08), sal = ez(t, v[2], v[3]);
    ln.setAttribute('opacity', Math.min(u, 1 - sal));
    ln.setAttribute('transform', `translate(0 ${f1((1 - u) * 24 - sal * 12)})`);
  });
}

function renderLogo(t) {
  const lg = S.logo;
  const visible = t > 21.5;
  lg.g.setAttribute('display', visible ? 'inline' : 'none');
  if (!visible) return;
  lg.monte.setAttribute('opacity', ez(t, T.s7Monte[0], T.s7Monte[1]));
  const W = T.s7Palabra;
  [lg.pA, lg.pL].forEach((p, i) => {
    const u = ez(t, W.t0 + i * W.paso, W.t0 + i * W.paso + W.dur);
    p.setAttribute('opacity', u);
    p.setAttribute('transform', `translate(${f1(-(1 - u) * 4)} 0)`);
  });
  // El punto cae dentro del anillo de la «o», como un pin.
  const u = ez(t, T.s7Punto[0], T.s7Punto[1]);
  lg.punto.setAttribute('opacity', lin(t, T.s7Punto[0], T.s7Punto[0] + 0.12));
  lg.punto.setAttribute('transform', `translate(0 ${f1(-(1 - u) * 26)})`);
}

/* ==========================================================================
   Reproducción y controles
   ========================================================================== */
let ultimo = null;
function bucle(ahora) {
  if (reproduciendo && ultimo !== null) {
    let t = tActual + Math.min(0.1, (ahora - ultimo) / 1000);
    if (t >= DUR) { t = DUR; reproduciendo = false; actualizaBoton(); }
    render(t);
    actualizaUI();
  }
  ultimo = ahora;
  requestAnimationFrame(bucle);
}
function actualizaUI() {
  $('#barra').value = tActual.toFixed(2);
  $('#tiempo').textContent = tActual.toFixed(2).replace('.', ',') + ' s';
  let nombre = PLANOS[0][1];
  for (const [t0, n] of PLANOS) if (tActual >= t0) nombre = n;
  $('#plano').textContent = nombre;
}
function actualizaBoton() { $('#bPlay').textContent = reproduciendo ? 'Pausa' : 'Reproducir'; }
function ajustaEscenario() {
  const svg = $('#stage');
  if (LIMPIO) { svg.style.width = '100vw'; svg.style.height = '100vh'; return; }
  const cont = $('#escena');
  const w = cont.clientWidth - 32, h = cont.clientHeight - 32;
  const k = Math.min(w / L.W, h / L.H);
  svg.style.width = L.W * k + 'px';
  svg.style.height = L.H * k + 'px';
}
function cambiaFormato(f) {
  FORMATO = f;
  construir();
  ajustaEscenario();
  render(tActual);
  document.querySelectorAll('[data-formato]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.formato === FORMATO)));
  const u = new URL(location.href); u.searchParams.set('formato', f); u.searchParams.delete('t'); history.replaceState(null, '', u);
}

async function iniciar() {
  if (LIMPIO) document.documentElement.classList.add('limpio');
  // ?consulta=nombresMapuzugun,fotoEstudiantes solo para mostrar la propuesta en la consulta misma.
  for (const k of (Q.get('consulta') || '').split(',')) if (k in CONSULTA) CONSULTA[k] = true;
  document.querySelectorAll('[data-consulta]').forEach((c) => { c.checked = CONSULTA[c.dataset.consulta]; });
  try {
    await Promise.all(['800 64px Archivo', '500 48px Newsreader', 'italic 500 48px Newsreader'].map((f) => document.fonts.load(f, 'aprende Ø º ′ ·')));
    await document.fonts.ready;
  } catch (e) { /* sin red: se sigue con las fuentes de respaldo */ }
  cambiaFormato(FORMATO);
  const t0 = parseFloat(Q.get('t'));
  if (!Number.isNaN(t0)) { reproduciendo = false; render(clamp(t0, 0, DUR)); }
  actualizaBoton(); actualizaUI();
  listo = true;
  requestAnimationFrame(bucle);

  $('#bPlay').onclick = () => { if (tActual >= DUR) render(0); reproduciendo = !reproduciendo; actualizaBoton(); };
  $('#bReiniciar').onclick = () => { render(0); reproduciendo = true; actualizaBoton(); actualizaUI(); };
  $('#barra').oninput = (e) => { reproduciendo = false; actualizaBoton(); render(parseFloat(e.target.value)); actualizaUI(); };
  document.querySelectorAll('[data-formato]').forEach((b) => (b.onclick = () => cambiaFormato(b.dataset.formato)));
  document.querySelectorAll('[data-consulta]').forEach((c) => (c.onchange = () => { CONSULTA[c.dataset.consulta] = c.checked; cambiaFormato(FORMATO); }));
  addEventListener('resize', ajustaEscenario);
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'range' && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); $('#bPlay').click(); }
    else if (e.key === 'r' || e.key === 'R') $('#bReiniciar').click();
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { reproduciendo = false; actualizaBoton(); render(clamp(tActual + (e.key === 'ArrowRight' ? 0.1 : -0.1), 0, DUR)); actualizaUI(); }
  });
}

/* Para exportar cuadro a cuadro (ver exportar.mjs). */
window.AL = {
  get listo() { return listo; },
  duracion: DUR,
  renderAt(t) { reproduciendo = false; render(clamp(t, 0, DUR)); },
};
iniciar();
</script>
